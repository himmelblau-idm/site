{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.is_homepage %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="Himmelblau — Entra ID for Linux">
  <meta property="og:description" content="MFA-secured SSH, Hello PIN desktop login, Intune compliance, and browser SSO for Linux.">
  <meta property="og:image" content="{{ config.site_url }}/assets/minimalist-blue-white-wave-background.png">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}
  <script type="text/javascript" data-cmp-ab="1" src="https://cdn.consentmanager.net/delivery/autoblocking/8bffa521a2c48.js" data-cmp-host="c.delivery.consentmanager.net" data-cmp-cdn="cdn.consentmanager.net" data-cmp-codesrc="16"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-970745524"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-970745524');

    function gtag_report_conversion(url) {
      var callback = function () {
        if (typeof url !== 'undefined') {
          window.location = url;
        }
      };

      gtag('event', 'conversion', {
        send_to: 'AW-970745524/haXpCK3x9aAaELTN8c4D',
        value: 1.0,
        currency: 'USD',
        event_callback: callback
      });

      return false;
    }
  </script>
  <script>
    (function () {
      var bannerId = "hb-donate-banner";
      var storageKey = "hb-donate-banner-dismissed";
      var hiddenClass = "hb-donate-banner-hidden";
      var dismissTtlMs = 30 * 24 * 60 * 60 * 1000;

      function markHidden() {
        document.documentElement.classList.add(hiddenClass);
      }

      try {
        var stored = localStorage.getItem(storageKey);
        if (stored) {
          var dismissedAt = parseInt(stored, 10);
          if (!Number.isNaN(dismissedAt) && Date.now() - dismissedAt < dismissTtlMs) {
            markHidden();
          }
        }
      } catch (err) {
        // ignore storage failures
      }

      document.addEventListener("DOMContentLoaded", function () {
        var banner = document.getElementById(bannerId);
        if (!banner) {
          return;
        }

        if (document.documentElement.classList.contains(hiddenClass)) {
          banner.setAttribute("hidden", "hidden");
          return;
        }

        var dismiss = banner.querySelector(".hb-donate-banner__dismiss");
        if (!dismiss) {
          return;
        }

        dismiss.addEventListener("click", function () {
          try {
            localStorage.setItem(storageKey, String(Date.now()));
          } catch (err) {
            // ignore storage failures
          }
          markHidden();
          banner.setAttribute("hidden", "hidden");
        });
      });
    })();
  </script>
{% endblock %}
